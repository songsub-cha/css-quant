  interpretation: "비율을 작게 설정할수록 손실은 작지만 잦은 손절이 발생할 수 있어요."
  caution: "갭 하락이 발생하면 설정한 비율보다 더 큰 손실로 체결될 수 있어요."
  in_system: "매도 규칙 1번(가장 먼저 평가)이에요."
  direction: neutral
