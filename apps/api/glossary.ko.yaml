  interpretation: "최고가가 갱신될 때마다 손절 기준선도 함께 올라가요."
  in_system: "매도 규칙 2번이에요. 진입 후 종가 기준 최고가(high_water_mark)를 추적해 계산해요."
  direction: neutral
  related: [stop_loss_pct, high_water_mark]

