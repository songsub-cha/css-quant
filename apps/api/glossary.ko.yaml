  interpretation: "진행 중이던 주문은 그대로 유지되고, 해제하려면 명시적인 조치와 사유 입력이 필요해요."
  in_system: "자동 정지 조건(연속 주문 실패, 브로커 대사 불일치, 품질 게이트 연속 실패, 킬 스위치)이 발동해도 같은 절차로 처리돼요."
  direction: neutral
  related: [kill_switch, market_shock]

