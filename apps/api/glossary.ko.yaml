- key: market_shock
  term_ko: "시장 충격 차단"
  term_en: "Market Shock Circuit Breaker"
  category: risk
  definition: "KOSPI가 하루에 3% 이상 급락하거나 VKOSPI가 20일 평균의 1.5배를 넘으면 신규 매수 후보 생성을 멈추는 안전장치예요."
  interpretation: "손절·익절 같은 보호 매도는 평소처럼 정상 작동해요."
  caution: "신호 발생일 장 마감 후~다음 날 시가 사이의 야간 충격은 이 장치로 감지되지 않아요."
  in_system: "매 거래일 점수 계산 후와 신규 주문 후보 생성 직전에 검사돼요."
  direction: neutral
  related: [market_regime, emergency_stop]

- key: emergency_stop
  term_ko: "긴급 정지"
  term_en: "Emergency Stop"
  category: risk
