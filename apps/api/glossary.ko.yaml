# 용어집 콘텐츠 (SoT A6.12) — 검수된 정적 콘텐츠, LLM 실시간 생성 금지(ADR 0010).
# 변경은 git 버전관리 + 코드 리뷰로 검수한다. DB 테이블이 아니다.
# 스키마: key, term_ko, term_en, category, definition, interpretation,
#         caution?, in_system?, direction?(higher_is_better|lower_is_better|neutral), related?

# ── 팩터 (factor) ──────────────────────────────────────────────
- key: momentum_factor
  term_ko: "모멘텀 팩터"
  term_en: "Momentum Factor"
  category: factor
  definition: "최근 일정 기간 동안 주가가 얼마나 올랐는지를 측정해 상승 추세가 이어질 가능성을 점수화한 지표예요."
  interpretation: "백분위가 높을수록 최근 상승세가 강한 종목이에요."
  caution: "단기 급등 후 되돌림(모멘텀 붕괴) 위험이 있어 다른 팩터와 함께 봐야 해요."
  in_system: "AI 점수 5개 팩터 중 하나 — 3개월/6개월 수익률, 52주 고가 대비 거리, 이동평균 정렬로 계산해요."
  direction: higher_is_better
  related: [momentum_3m, momentum_6m, dist_52w_high, ma_alignment]

- key: quality_factor
  term_ko: "퀄리티 팩터"
  term_en: "Quality Factor"
  category: factor
  definition: "기업의 수익성과 재무 건전성이 얼마나 튼튼한지를 측정하는 지표예요."
  interpretation: "높을수록 이익률이 좋고 빚이 적은 우량 기업에 가까워요."
  in_system: "ROE·영업이익률·매출성장·부채비율로 계산해요."
  direction: higher_is_better
  related: [roe, operating_margin, revenue_growth_yoy, debt_ratio]

- key: value_factor
  term_ko: "밸류 팩터"
  term_en: "Value Factor"
  category: factor
  definition: "주가가 기업 실적·자산에 비해 싸게 거래되는지를 측정하는 지표예요."
  interpretation: "백분위가 높을수록(즉 PER·PBR 등이 낮을수록) 저평가된 종목에 가까워요."
  caution: "낮은 PER이 항상 저평가는 아니고, 실적 악화를 미리 반영한 '밸류 트랩'일 수 있어요."
  in_system: "PER·PBR·EV/EBITDA·섹터 상대 PER로 계산해요."
  direction: higher_is_better
  related: [per, pbr, ev_ebitda, sector_relative_per]

- key: liquidity_factor
  term_ko: "유동성 팩터"
  term_en: "Liquidity Factor"
  category: factor
  definition: "원할 때 큰 손해 없이 사고팔 수 있는 정도를 측정하는 지표예요."
  interpretation: "높을수록 거래가 활발해 매매하기 쉬운 종목이에요."
  in_system: "20일 평균 거래대금·거래량 변동계수로 계산해요."
  direction: higher_is_better
  related: [avg_trading_value_20d, volume_cv]

- key: risk_factor
  term_ko: "리스크(역수) 팩터"
  term_en: "Risk Factor (Inverse)"
  category: factor
  definition: "가격이 얼마나 불안정하게 움직이는지를 측정한 뒤, 안정적일수록 높은 점수를 주는 지표예요."
  interpretation: "백분위가 높을수록 변동성과 급락 위험이 낮은 안정적인 종목이에요."
  in_system: "60일 변동성·MDD·갭 발생 빈도를 반대로 뒤집어 계산해요(그래서 '역수')."
  direction: higher_is_better
  related: [volatility, mdd, gap_frequency]

- key: total_score
  term_ko: "AI 종합 점수"
  term_en: "AI Total Score"
  category: factor
  definition: "5개 팩터 점수를 그날의 시장 레짐에 맞는 가중치로 합산한 최종 점수예요(0~100)."
  interpretation: "높을수록 여러 팩터를 종합했을 때 매력적인 종목이에요."
  caution: "점수는 과거 데이터 기반 통계 결과일 뿐 매수 추천이 아니에요."
  in_system: "랭킹 화면의 기본 정렬 기준이에요."
  direction: higher_is_better
  related: [momentum_factor, quality_factor, value_factor, liquidity_factor, risk_factor, market_regime]

- key: percentile_score
  term_ko: "백분위 점수"
  term_en: "Percentile Score"
  category: factor
  definition: "유니버스(약 700종목) 안에서 해당 종목의 지표가 상대적으로 몇 번째 순위인지를 0~100 사이 숫자로 나타낸 값이에요."
  interpretation: "50이면 딱 중간, 100에 가까울수록 유니버스 내 상위권이에요."
  caution: "결측치는 50(중립)으로 처리돼 실제로는 정보가 없다는 뜻일 수 있어요."
  in_system: "팩터 계산 후 정규화 단계에서 상하위 1%를 잘라내는 윈저라이징을 적용해요."
  direction: neutral

- key: momentum_3m
  term_ko: "3개월 수익률"
  term_en: "3-Month Return"
  category: factor
  definition: "최근 3개월 동안 주가가 오르거나 내린 비율이에요."
  interpretation: "높을수록 최근 상승세가 강해요."
  in_system: "Momentum 팩터의 입력 지표예요."
  direction: higher_is_better
  related: [momentum_factor]

- key: momentum_6m
  term_ko: "6개월 수익률"
  term_en: "6-Month Return"
  category: factor
  definition: "최근 6개월 동안 주가가 오르거나 내린 비율이에요."
  interpretation: "높을수록 중기 상승세가 강해요."
  in_system: "Momentum 팩터의 입력 지표예요."
  direction: higher_is_better
  related: [momentum_factor]

- key: dist_52w_high
  term_ko: "52주 고가 대비 거리"
  term_en: "Distance from 52-Week High"
  category: factor
  definition: "현재 주가가 최근 1년 최고가에서 얼마나 떨어져 있는지를 보여줘요."
  interpretation: "0에 가까울수록(고가에 가까울수록) 강한 상승 추세로 해석돼요."
  in_system: "Momentum 팩터의 입력 지표예요."
  direction: higher_is_better
  related: [momentum_factor]

- key: ma_alignment
  term_ko: "이동평균 정렬"
  term_en: "Moving Average Alignment"
  category: factor
  definition: "단기 이동평균이 장기 이동평균 위에 있는지(정배열)를 확인하는 추세 지표예요(예: 20일선 > 60일선)."
  interpretation: "정배열이면 상승 추세, 역배열이면 하락 추세로 해석돼요."
  in_system: "Momentum 팩터의 입력 지표이자 매수 조건(buy_rules.ma_alignment)으로도 쓰여요."
  direction: neutral
  related: [momentum_factor]

- key: avg_trading_value_20d
  term_ko: "20일 평균 거래대금"
  term_en: "20-Day Average Trading Value"
  category: factor
  definition: "최근 20거래일 동안 하루 평균 거래된 금액이에요."
  interpretation: "높을수록 거래가 활발해 매매하기 쉬운 종목이에요."
  in_system: "Liquidity 팩터의 입력이자 유니버스 필터·주문 참여율 한도의 기준값이에요."
  direction: higher_is_better
  related: [liquidity_factor, max_participation_pct]

- key: volume_cv
  term_ko: "거래량 변동계수"
  term_en: "Volume Coefficient of Variation"
  category: factor
  definition: "거래량이 날마다 얼마나 들쭉날쭉한지를 보여주는 지표예요."
  interpretation: "낮을수록 거래량이 꾸준해 예측 가능한 종목이에요."
  in_system: "Liquidity 팩터의 입력 지표예요."
  direction: lower_is_better
  related: [liquidity_factor]

- key: gap_frequency
  term_ko: "갭 발생 빈도"
  term_en: "Gap Frequency"
  category: factor
  definition: "전날 종가와 오늘 시가 사이에 큰 가격 차이(갭)가 얼마나 자주 발생하는지를 보여줘요."
  interpretation: "낮을수록 가격이 안정적으로 이어지는 종목이에요."
  in_system: "Risk 팩터의 입력 지표예요."
  direction: lower_is_better
  related: [risk_factor]

# ── 재무지표 (financial_metric) ────────────────────────────────
- key: per
  term_ko: "PER(주가수익비율)"
  term_en: "PER (Price-to-Earnings Ratio)"
  category: financial_metric
  definition: "주가를 주당순이익으로 나눈 값으로, 이익 대비 주가가 비싼지 싼지를 보여줘요."
  interpretation: "낮을수록 이익 대비 저평가, 높을수록 고평가로 해석돼요."
  caution: "낮은 PER이 실적 악화를 미리 반영한 '밸류 트랩'일 수 있어 다른 지표와 함께 봐야 해요."
  in_system: "Value 팩터의 입력 지표 중 하나예요."
  direction: lower_is_better
  related: [value_factor, pbr, ev_ebitda]

- key: pbr
  term_ko: "PBR(주가순자산비율)"
  term_en: "PBR (Price-to-Book Ratio)"
  category: financial_metric
  definition: "주가를 주당순자산으로 나눈 값으로, 회사 장부상 자산 대비 주가 수준을 보여줘요."
  interpretation: "1보다 낮으면 장부가치보다 싸게 거래된다는 뜻이에요."
  in_system: "Value 팩터의 입력 지표 중 하나예요."
  direction: lower_is_better
  related: [value_factor, per]

- key: ev_ebitda
  term_ko: "EV/EBITDA"
  term_en: "EV/EBITDA"
  category: financial_metric
  definition: "기업가치(EV)를 세전영업이익(EBITDA)으로 나눈 값으로, 부채까지 고려한 저평가 지표예요."
  interpretation: "낮을수록 실질 기업가치 대비 저평가로 해석돼요."
  in_system: "Value 팩터의 입력 지표 중 하나예요."
  direction: lower_is_better
  related: [value_factor]

- key: sector_relative_per
  term_ko: "섹터 상대 PER"
  term_en: "Sector-Relative PER"
  category: financial_metric
  definition: "같은 업종 내 다른 종목들과 비교한 PER 수준이에요."
  interpretation: "낮을수록 같은 업종 안에서 상대적으로 저평가된 종목이에요."
  in_system: "Value 팩터의 입력 지표 중 하나예요(업종별 밸류에이션 차이를 보정)."
  direction: lower_is_better
  related: [value_factor, per]

- key: roe
  term_ko: "ROE(자기자본이익률)"
  term_en: "ROE (Return on Equity)"
  category: financial_metric
  definition: "자기자본으로 얼마나 많은 이익을 냈는지를 보여주는 수익성 지표예요."
  interpretation: "높을수록 자본을 효율적으로 굴려 이익을 내는 기업이에요."
  in_system: "Quality 팩터의 입력 지표 중 하나예요."
  direction: higher_is_better
  related: [quality_factor]

- key: operating_margin
  term_ko: "영업이익률"
  term_en: "Operating Margin"
  category: financial_metric
  definition: "매출액 중 영업이익이 차지하는 비율로, 본업으로 돈을 얼마나 잘 버는지를 보여줘요."
  interpretation: "높을수록 본업의 수익성이 좋은 기업이에요."
  in_system: "Quality 팩터의 입력 지표 중 하나예요."
  direction: higher_is_better
  related: [quality_factor]

- key: debt_ratio
  term_ko: "부채비율"
  term_en: "Debt Ratio"
  category: financial_metric
  definition: "자기자본 대비 부채가 얼마나 많은지를 보여주는 재무 건전성 지표예요."
  interpretation: "낮을수록 빚이 적어 재무적으로 안정적인 기업이에요."
  in_system: "Quality 팩터의 입력 지표 중 하나예요."
  direction: lower_is_better
  related: [quality_factor]

- key: revenue_growth_yoy
  term_ko: "매출성장률(YoY)"
  term_en: "Revenue Growth (YoY)"
  category: financial_metric
  definition: "작년 같은 기간과 비교해 매출이 얼마나 늘었는지를 보여주는 성장성 지표예요."
  interpretation: "높을수록 사업이 빠르게 성장하고 있다는 뜻이에요."
  in_system: "Quality 팩터의 입력 지표 중 하나예요."
  direction: higher_is_better
  related: [quality_factor]

- key: ttm
  term_ko: "TTM(최근 12개월 합산)"
  term_en: "TTM (Trailing Twelve Months)"
  category: financial_metric
  definition: "가장 최근 4개 분기 실적을 합산해 최근 1년치 실적처럼 보는 계산 방식이에요."
  interpretation: "계절성 없이 최신 실적 흐름을 반영해요."
  in_system: "재무 팩터(Quality/Value)는 모두 TTM 기준, 연결재무제표(CFS)를 우선 사용해요."
  direction: neutral
  related: [quality_factor, value_factor]

# ── 성과지표 (performance_metric) ──────────────────────────────
- key: cumulative_return
  term_ko: "누적 수익률"
  term_en: "Cumulative Return"
  category: performance_metric
  definition: "투자 시작 시점부터 지금까지 전체 수익률이 얼마인지를 보여줘요."
  interpretation: "높을수록 전체 기간 성과가 좋았다는 뜻이에요."
  in_system: "백테스트·모의투자 결과 화면의 핵심 지표예요."
  direction: higher_is_better

- key: cagr
  term_ko: "CAGR(연평균 복리수익률)"
  term_en: "CAGR (Compound Annual Growth Rate)"
  category: performance_metric
  definition: "여러 해에 걸친 수익률을 매년 일정한 비율로 복리 성장했다고 가정해 연 단위로 환산한 값이에요."
  interpretation: "높을수록 연 단위 성과가 좋아요."
  in_system: "백테스트 결과 지표예요."
  direction: higher_is_better
  related: [cumulative_return]

- key: mdd
  term_ko: "MDD(최대낙폭)"
  term_en: "MDD (Maximum Drawdown)"
  category: performance_metric
  definition: "투자 기간 중 고점 대비 가장 크게 떨어졌던 하락폭이에요."
  interpretation: "낮을수록(0에 가까울수록) 큰 손실 구간이 없었다는 뜻이에요."
  caution: "수익률이 좋아도 MDD가 크면 그 구간을 견디기 어려웠을 수 있어요."
  in_system: "Risk 팩터의 입력이자 백테스트 결과·누적 손실 킬 스위치의 기준이에요."
  direction: lower_is_better
  related: [risk_factor, kill_switch]

- key: volatility
  term_ko: "변동성"
  term_en: "Volatility"
  category: performance_metric
  definition: "가격이 평균에서 얼마나 크게 흔들리는지를 보여주는 지표예요(보통 60일 기준 표준편차)."
  interpretation: "낮을수록 가격이 안정적인 종목이에요."
  in_system: "Risk 팩터의 입력이자 백테스트 결과 지표이고, 시장 레짐 판정(20일 변동성)에도 쓰여요."
  direction: lower_is_better
  related: [risk_factor, market_regime]

- key: sharpe_ratio
  term_ko: "샤프 비율"
  term_en: "Sharpe Ratio"
  category: performance_metric
  definition: "감수한 위험(변동성) 대비 얼마나 좋은 수익을 냈는지를 보여주는 지표예요."
  interpretation: "높을수록 위험 대비 효율적인 성과예요."
  in_system: "백테스트 결과 지표이자 가중치 튜닝의 목표 함수 후보예요."
  direction: higher_is_better

- key: win_rate
  term_ko: "승률"
  term_en: "Win Rate"
  category: performance_metric
  definition: "전체 매매 중 이익을 낸 매매의 비율이에요."
  interpretation: "높을수록 이긴 매매가 많다는 뜻이지만, 한 번의 큰 손실이 여러 번의 작은 이익을 상쇄할 수 있어요."
  caution: "추세추종 전략은 승률이 낮아도 payoff ratio가 높으면 전체적으로 수익성이 좋을 수 있어요 — 승률만으로 평가하지 마세요."
  in_system: "백테스트 결과 지표예요."
  direction: higher_is_better
  related: [payoff_ratio]

- key: payoff_ratio
  term_ko: "Payoff Ratio(손익비)"
  term_en: "Payoff Ratio"
  category: performance_metric
  definition: "평균 이익 매매 금액을 평균 손실 매매 금액으로 나눈 값으로, 이길 때 얼마나 크게 이기고 질 때 얼마나 작게 지는지를 보여줘요."
  interpretation: "1보다 클수록 이길 때 버는 돈이 질 때 잃는 돈보다 크다는 뜻이에요."
  caution: "추세추종 전략은 승률보다 이 지표로 평가하는 것이 더 적절해요."
  in_system: "백테스트 결과 지표예요."
