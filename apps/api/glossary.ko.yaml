  term_ko: "데이터 품질 게이트"
  term_en: "Data Quality Gate"
  category: risk
  definition: "점수 계산과 신호 생성 직전에 그날 수집된 데이터가 믿을 만한지 자동으로 검사하는 장치예요(신선도·커버리지·무결성·지표 계산 가능 여부)."
  interpretation: "실패하면 그날은 아예 매매 신호가 생성되지 않아요(무거래가 안전한 기본값)."
  caution: "실패한 낡은 데이터로 조용히 매매 신호가 나가는 것을 막기 위한, 무인 운영의 핵심 안전장치예요."
  in_system: "개별 종목 결측은 그 종목만 점수 보류하고, 전체 게이트 실패는 당일 전체를 중단해요."
  direction: neutral

# ── 공시 (disclosure) ──────────────────────────────────────────
- key: capital_increase_paid
  term_ko: "유상증자"
  term_en: "Rights Offering (Paid-in Capital Increase)"
  category: disclosure
  definition: "회사가 새 주식을 발행해 투자자에게 돈을 받고 파는 것으로, 자금을 조달하는 대표적인 방법이에요."
  interpretation: "발행가가 시가보다 낮을수록, 발행 물량이 많을수록 기존 주주의 지분 가치가 희석될 수 있어요."
  in_system: "중요 공시 화이트리스트 항목이에요."
  direction: neutral

- key: capital_increase_free
  term_ko: "무상증자"
  term_en: "Bonus Issue (Free Capital Increase)"
  category: disclosure
  definition: "회사가 이익잉여금 등을 자본으로 옮기며 주주에게 새 주식을 공짜로 나눠주는 것이에요."
  interpretation: "무상증자 비율이 높을수록 유통 주식 수가 크게 늘어나요. 보통 주가에 긍정적으로 받아들여지지만 회사의 실질 가치가 늘어나는 것은 아니에요."
  in_system: "중요 공시 화이트리스트 항목이에요."
  direction: neutral

- key: capital_reduction
  term_ko: "감자"
  term_en: "Capital Reduction"
  category: disclosure
  definition: "회사가 발행 주식 수를 줄여 자본금을 감소시키는 것이에요."
  interpretation: "감자 비율이 클수록 보유 주식 수가 크게 줄어들어요."
  caution: "실적 악화로 인한 감자는 주주에게 큰 손실을 주는 부정적 신호인 경우가 많아요."
  in_system: "중요 공시 화이트리스트 항목이에요."
  direction: neutral

- key: merger_split
  term_ko: "합병·분할"
  term_en: "Merger/Spin-off"
  category: disclosure
  definition: "두 회사가 하나로 합쳐지거나(합병), 한 회사가 여러 회사로 나뉘는(분할) 것이에요."
  interpretation: "합병·분할 비율에 따라 보유 주식 수와 가치가 달라질 수 있어요."
  in_system: "중요 공시 화이트리스트 항목이에요."
  direction: neutral

- key: business_suspension
  term_ko: "영업정지"
  term_en: "Business Suspension"
  category: disclosure
  definition: "회사의 주된 사업 활동이 규제 등의 이유로 멈추는 것이에요."
  interpretation: "정지 기간이 길수록 매출 타격이 커져요."
  caution: "매출에 직접적인 타격을 줄 수 있는 부정적 신호예요."
  in_system: "중요 공시 화이트리스트 항목이에요."
  direction: neutral

- key: audit_opinion
  term_ko: "감사의견 관련"
  term_en: "Audit Opinion"
  category: disclosure
  definition: "외부 회계감사인이 회사의 재무제표가 적정한지 평가한 의견이에요(적정/한정/부적정/의견거절)."
  interpretation: "'적정' 의견이 아니면 재무제표를 그대로 믿기 어렵다는 뜻이에요."
  caution: "'적정' 외의 의견은 관리종목 지정이나 상장폐지로 이어질 수 있는 강한 경고 신호예요."
  in_system: "중요 공시 화이트리스트 항목이에요."
  direction: neutral

- key: unfaithful_disclosure
  term_ko: "불성실공시법인 지정"
  term_en: "Unfaithful Disclosure Designation"
  category: disclosure
  definition: "거래소가 공시 의무를 제대로 지키지 않은 회사를 지정하는 제도예요."
  interpretation: "지정 횟수가 누적되면 관리종목 지정으로 이어질 수 있어요."
  caution: "정보 신뢰도에 대한 경고 신호예요."
  in_system: "중요 공시 화이트리스트 항목이에요."
  direction: neutral
  related: [management_stock_designation]

- key: embezzlement
  term_ko: "횡령·배임"
  term_en: "Embezzlement/Breach of Trust"
  category: disclosure
  definition: "회사 경영진 등이 회사 자산을 개인적으로 유용하거나 회사에 손해를 끼치는 행위예요."
  interpretation: "금액이 자기자본 대비 클수록 심각도가 높아요."
  caution: "신뢰를 크게 훼손하는 사건으로 주가에 급격한 악영향을 줄 수 있어요."
  in_system: "중요 공시 화이트리스트 항목이에요."
  direction: neutral

- key: litigation
  term_ko: "소송"
  term_en: "Litigation"
  category: disclosure
  definition: "회사가 원고 또는 피고로 참여하는 재판 절차예요."
  interpretation: "소송 규모가 회사 자기자본 대비 클수록 중요도가 높아요."
  in_system: "중요 공시 화이트리스트 항목이에요."
  direction: neutral

- key: revenue_profit_change_30
  term_ko: "매출·손익 30% 이상 변동"
  term_en: "Revenue/Profit Change of 30%+"
  category: disclosure
  definition: "매출액이나 영업이익·순이익이 직전 대비 30% 이상 크게 변한 경우 의무적으로 공시하는 항목이에요."
  interpretation: "증가면 긍정적, 감소면 부정적 신호로 해석하되 일회성 요인인지 확인이 필요해요."
  in_system: "중요 공시 화이트리스트 항목이에요."
  direction: neutral

- key: management_stock_designation
  term_ko: "관리종목·투자주의환기 지정"
  term_en: "Management Stock/Investment Alert Designation"
  category: disclosure
  definition: "거래소가 상장폐지 위험이 있거나 투자자 주의가 필요한 종목을 지정하는 제도예요."
  interpretation: "지정되면 유니버스 필터에서 제외되어 신규 매수 후보에서 빠져요."
  caution: "지정되어도 기존 보유 종목이 강제로 매도되지는 않아요 — 매도 여부는 매도 규칙과 오너 판단에 맡겨요."
  in_system: "유니버스 필터 제외 대상이자 중요 공시 화이트리스트 항목이에요."
  direction: neutral
  related: [unfaithful_disclosure]

- key: delisting
  term_ko: "상장폐지 관련"
  term_en: "Delisting-Related"
  category: disclosure
  definition: "회사 주식이 거래소에서 더 이상 거래되지 못하게 되는 것과 관련된 공시예요."
  interpretation: "정리매매 기간이 있다면 그 안에 매도 여부를 판단해야 해요."
  caution: "투자금 회수가 매우 어려워질 수 있는 가장 심각한 위험 신호예요."
  in_system: "중요 공시 화이트리스트 항목이에요. 백테스트의 상장폐지 종목(survivorship) 처리와도 연결돼요."
  direction: neutral

# ── 시장·레짐 (market_regime) ──────────────────────────────────
- key: market_regime
  term_ko: "시장 레짐"
  term_en: "Market Regime"
  category: market_regime
  definition: "지금 시장이 안정적인 상태(NORMAL)인지 불안정한 상태(DEFENSIVE)인지를 매 거래일 자동으로 판정한 값이에요."
  interpretation: "DEFENSIVE일 때는 더 방어적인 팩터 가중치가 적용돼요."
  in_system: "KOSPI가 200일 이동평균 위에 있고 VKOSPI(또는 변동성)가 낮으면 NORMAL, 아니면 DEFENSIVE예요."
  direction: neutral
  related: [regime_weight_profile, hysteresis, market_shock]

- key: regime_weight_profile
  term_ko: "레짐별 가중치 프로파일"
  term_en: "Regime Weight Profile"
  category: market_regime
  definition: "시장 레짐(NORMAL/DEFENSIVE)에 따라 5개 팩터를 합산할 때 사용하는 가중치 조합이에요."
  interpretation: "DEFENSIVE일 때는 Quality와 Risk(역수) 팩터의 비중이 커지고 Momentum 비중은 줄어들어요."
  in_system: "점수 산출 당시의 가중치는 재현성을 위해 점수와 함께 저장돼요."
  direction: neutral
  related: [market_regime, total_score]

- key: hysteresis
  term_ko: "히스테리시스"
  term_en: "Hysteresis"
  category: market_regime
  definition: "레짐이 자주 왔다갔다 하지 않도록, 방향에 따라 다른 조건을 적용하는 규칙이에요."
  interpretation: "안전한 상태(NORMAL)로 돌아가는 건 3거래일 연속 조건을 만족해야 하지만, 위험한 상태(DEFENSIVE)로 가는 건 즉시 반영돼요."
  in_system: "레짐 판정 로직에 쓰여요."
  direction: neutral
  related: [market_regime]

- key: cold_start
  term_ko: "콜드 스타트"
  term_en: "Cold Start"
  category: market_regime
  definition: "이전 레짐 기록이 전혀 없을 때 시스템이 어떤 상태로 시작할지를 정하는 규칙이에요."
  interpretation: "안전을 우선해 DEFENSIVE(방어적 상태)로 시작해요."
  in_system: "레짐 히스토리 백필의 시작 조건이에요."
  direction: neutral
  related: [market_regime]

- key: vkospi
  term_ko: "VKOSPI(코스피 변동성지수)"
  term_en: "VKOSPI"
  category: market_regime
  definition: "옵션 가격으로부터 계산되는 코스피 시장의 예상 변동성(공포지수)이에요."
  interpretation: "높을수록 투자자들이 앞으로 시장이 불안정할 것으로 예상한다는 뜻이에요."
  in_system: "시장 레짐 판정과 시장 충격 차단의 입력값이에요."
  direction: lower_is_better
  related: [market_regime, market_shock]
