  interpretation: "높을수록 시장 평균 대비 성과가 좋다는 뜻이에요."
  caution: "전략은 배당이 반영된 수정주가를 쓰고 벤치마크 지수는 배당 미포함이라, 초과수익이 실제보다 연 1~2%p 유리하게 보일 수 있어요."
