  definition: "전략이 AI 종합 점수를 기준으로 매수 후보를 좁히는 조건이에요(최소 점수, 상위 N종목)."
  interpretation: "min_score를 높게 설정할수록 더 엄격하게 종목을 고르게 돼요."
